function pick(mx,my){let best=null,bd=1e9;N.forEach(n=>{const dx=mx-n.cxp,dy=my-n.cyp,d=Math.sqrt(dx*dx+dy*dy);const hit=Math.max(n.r+5,9);if(d<hit&&d<bd){bd=d;best=n;}});return best;}
let dragging=null,moved=false,down=null,dsx=0,dsy=0;
function evXY(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener("pointermove",e=>{const p=evXY(e),mx=p[0],my=p[1];if(down){if(!moved&&(Math.abs(mx-dsx)>6||Math.abs(my-dsy)>6))moved=true;if(moved){down.hx=mx;down.hy=my;down.sx=mx;down.sy=my;}return;}const n=pick(mx,my);const id=n?n.id:null;if(id!==hoverId){hoverId=id;cv.style.cursor=n&&(n.click||n.menu)?"pointer":(n?"default":"grab");}});
cv.addEventListener("pointerdown",e=>{const p=evXY(e);down=pick(p[0],p[1]);dragging=down;moved=false;dsx=p[0];dsy=p[1];if(down&&cv.setPointerCapture){try{cv.setPointerCapture(e.pointerId);}catch(_){}}});
window.addEventListener("pointerup",()=>{if(down&&!moved){down.menu?showMenu():(down.click?showNode(down):0);}dragging=null;down=null;});
// ---- drawer ----
const drawer=document.getElementById("drawer"),scrim=document.getElementById("scrim");
function openD(){drawer.classList.add("open");drawer.setAttribute("aria-hidden","false");scrim.classList.add("on");cv.classList.add("recede");TH=THEMES.amber;}
function closeD(){drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true");scrim.classList.remove("on");cv.classList.remove("recede");TH=THEMES[baseTheme];}
document.getElementById("closeBtn").onclick=closeD;scrim.onclick=closeD;document.addEventListener("keydown",e=>{if(e.key==="Escape")closeD();});document.getElementById("menuBtn").onclick=function(){location.href="menu.html";};
function cf(c){return c==="CF-2025-001"?"CF-2025-001-replit-database-deletion.md":c==="CF-2026-002"?"CF-2026-002-openclaw-inbox-deletion.md":"CF-2026-003-openclaw-matplotlib-influence-operation.md";}
function showNode(n){document.getElementById("dKind").textContent=(n.ext?"external resource":LBL[n.t])+(n.cs?" · "+n.cs:"");document.getElementById("dTitle").textContent=n.l;document.getElementById("dMeta").textContent=n.sub||"";
 let h="<p>"+n.b+"</p>";const rel=adj[n.id].filter(x=>x.o!=="hub"&&byId[x.o].t!=="ambient"&&x.verb!=="linked");
 if(rel.length){h+='<div class="relh">relations</div>';rel.forEach(x=>{h+='<div class="rel"><span class="verb">'+x.verb+'</span><span class="who">'+byId[x.o].l+'</span></div>';});}
 if(n.ext){h+='<div class="sech">resource</div><a class="go" href="'+n.href+'" target="_blank" rel="noopener">Open '+n.l+' ↗</a>';}
 else if(n.href){h+='<div class="sech">page</div><a class="go" href="'+n.href+'">Open '+n.l+' →</a>';}
 else if(n.cs){h+='<div class="sech">case file</div><a class="go" href="https://github.com/AI-Investigations/resources/blob/main/case-files/'+cf(n.cs)+'" target="_blank" rel="noopener">Open '+n.cs+' ↗</a>';}
 h+='<div class="disc">Drawn from the public record. The chart stays behind, blurred, close to return to it.</div>';document.getElementById("dBody").innerHTML=h;openD();}
function showMenu(){document.getElementById("dKind").textContent="entry point";document.getElementById("dTitle").textContent="Simplified menu";document.getElementById("dMeta").textContent="";
 const items=[["Start here","menu.html","orientation"],["Scope map","menu.html#scope","the territory"],["Playbooks","menu.html#playbook","first hours · examine"],["Case files","menu.html#cases","public record"],["Frameworks","menu.html#frameworks","coverage gaps"],["Evidence checklist","menu.html#evidence","what's needed"],["Regulatory tracker","regulatory.html","deadlines"],["Tools & databases","menu.html#tools","the ecosystem"],["Contribute","menu.html#contribute","sourced, useful"]];
 let h='<p>This opens the simplified text index of the site.</p><ul class="menu-list">';items.forEach(i=>h+='<li><a href="'+i[1]+'">'+i[0]+'<span class="ms">'+i[2]+'</span></a></li>');
 h+='</ul><div class="disc">Every node is a real entity from the public case files and resource pages; the smaller outer nodes are real context (sources, frameworks, tools, regimes). The named vendors and people are in the underlying case files.</div>';document.getElementById("dBody").innerHTML=h;openD();}
// ---- legend + theme switch ----
function buildLegend(){let lg="";["agent","human","system","artifact","constraint","event","resource"].forEach(k=>{lg+='<div class="lr"><span class="dot" style="background:'+TH.types[k]+'"></span>'+LBL[k]+'</div>';});lg+='<div class="lr sep"><span class="dot" style="background:'+TH.types.ambient+'"></span>'+LBL.ambient+'</div>';document.getElementById("legend").innerHTML=lg;}
const TKEYS=[["i2","i2"],["cool","Cool"],["amber","Amber"],["brand","Brand"]];
function buildThemes(){const c=document.getElementById("themes");let h="";TKEYS.forEach(k=>h+='<button data-k="'+k[0]+'"'+(baseTheme===k[0]?' class="on"':'')+'>'+k[1]+'</button>');c.innerHTML=h;
 c.querySelectorAll("button").forEach(b=>b.onclick=()=>{baseTheme=b.dataset.k;TH=THEMES[baseTheme];buildThemes();buildLegend();});}
buildLegend();
</script>
